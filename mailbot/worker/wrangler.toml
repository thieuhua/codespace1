name = "mailbot"
main = "src/index.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "mailbot"
database_id = "6f2851ac-38a6-4888-8710-6d276756c647"

# Gửi thư trả lời (Workers Free: chỉ tới địa chỉ đã xác minh trong Email Routing)
[[send_email]]
name = "EMAIL"

[vars]
MAIL_DOMAIN = "xuanthieu.site"
# Agent trên laptop, qua nginx VPS + hầm wg-lap (lap-web add mailbot 20025)
WAKE_URL = "https://mailbot.xuanthieu.site/wake"

# Secrets (wrangler secret put ...):
#   API_TOKEN   — MCP đọc inbox claude@
#   ADMIN_TOKEN — agent trên laptop + quản lý whitelist (~/.mailbot/agent.json)
