name: VPS MCP source verification
on:
  push:
    paths:
      - 'vps-mcp/**'
      - '.github/workflows/vps-mcp-test.yml'
  pull_request:
    paths:
      - 'vps-mcp/**'
      - '.github/workflows/vps-mcp-test.yml'
  workflow_dispatch:

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile production Python
        run: python -m compileall -q vps-mcp/gateway.py vps-mcp/worker.py vps-mcp/broker.py
      - name: Verify production sources and units
        run: python -m unittest -v vps-mcp/production_smoke_test.py
      - name: Check owner-SSH installer syntax
        run: bash -n vps-mcp/deploy/production/install.sh
      - name: Install OAuth front door dependencies
        run: python -m pip install -r vps-mcp/oauth/requirements.txt
      - name: OAuth front door tests
        working-directory: vps-mcp/oauth
        run: python -m unittest -v test_oauth_proxy
      - name: OAuth end-to-end (real gateway + SDK OAuth client)
        working-directory: vps-mcp/oauth
        run: PYTHONPATH=. python e2e_check.py
      - name: Check OAuth deploy scripts syntax
        run: for f in vps-mcp/oauth/deploy/*.sh; do bash -n "$f"; done
