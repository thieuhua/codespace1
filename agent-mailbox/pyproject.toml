[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-mailbox"
version = "0.1.0"
description = "Local authenticated stdio MCP sessions and mailboxes"
requires-python = ">=3.11"
dependencies = ["mcp==1.30.0"]

[tool.setuptools.packages.find]
include = ["agent_mailbox*"]

[tool.setuptools.package-data]
"agent_mailbox.core" = ["migrations/*.sql", "*.md"]
